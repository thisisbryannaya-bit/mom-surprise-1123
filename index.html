world{height:270px}.final #sofa{opacity:0}.final #girl{transform:translate(160px,254px) rotate(10deg) scale(.85)}.final #mom{transform:translate(235px,250px) rotate(-5deg) scale(.9)}.final #gift{opacity:0}.final #caption{display:none}.final .sun{top:210px}.final footer{margin-top:20px}.flash{animation:flash 1.5s}.paper-zoom{animation:paper-zoom 2.8s forwards!important;pointer-events:none}@keyframes float{50%{translate:0 -10px;rotate:2deg}}@keyframes drift{to{transform:translateX(130px)}}@keyframes twinkle{to{opacity:.2;transform:scale(.6)}}@keyframes breathe{to{translate:0 2px;rotate:1deg}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes warp{from{transform:scale(.1) rotate(0);opacity:0}50%{opacity:1}to{transform:scale(2.7) rotate(100deg);opacity:0}}@keyframes tunnel-in{from{opacity:0;transform:scale(.05)}to{opacity:1;transform:scale(1)}}@keyframes arrive{from{transform:translate(20px,240px) scale(.2);opacity:0}50%{transform:translate(105px,205px) rotate(-10deg);opacity:1}to{transform:translate(147px,234px) rotate(8deg)}}@keyframes lean{to{transform:rotate(12deg)}}@keyframes flash{50%{filter:brightness(1.8)}}@keyframes paper-zoom{to{transform:translateY(30px) scale(7);opacity:0}}@keyframes reveal{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}@media(min-width:650px){body{padding:24px}main{border-radius:28px;box-shadow:0 15px 100px #392b5355;min-height:calc(100svh - 48px)}.intro{margin-top:50px}}@media(max-height:720px){.intro{margin-top:5vh}.intro h1{font-size:44px}#envelope{margin:35px auto}.scene-active #world{height:44svh}.scene-active #line{font-size:18px;margin:10px 0}.scene-active footer{margin-top:16px}}@media(prefers-reduced-motion:reduce){.cloud,#stars i,.head,#envelope{animation:none}}

function tone(freq,time=0,dur=.8,volume=.045){if(!audio||muted)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+time;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur)}
function chime(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.13,1.3,.05))}

async function soundOn(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();await audio.resume();muted=false;$('#sound').textContent='♫ 音乐开';$('#sound').setAttribute('aria-label','关闭音乐');music()}catch(e){$('#sound').textContent='音乐不可用'}}

async function openLetter(){if(busy||step!==0)return;busy=true;const token=run;await soundOn();chime();$('#envelope').classList.add('opened');caption('一份特别的心意','妈妈，生日快乐！\n今天有一份特别的礼物要送给你。');await wait(5200);if(token!==run)return;$('#envelope').classList.add('paper-zoom');await wait(1800);scene('library thinking');step=1;caption('虽然不能在你身边','妈妈，虽然今年生日，\n我不能陪在你身边……','听我说 ♡');busy=false}
$('#envelope').onclick=openLetter;
next.onclick=async()=>{if(busy)return;if(step===0)return openLetter();busy=true;const token=run;switch(step){case 1:caption('虽然不能在你身边','因为我还在学校呀🥺','想一个小办法 ✧');step=2;break;case 2:scene('library portal');chime();caption('电脑里，好像有星星','咦？这束光……\n好像可以通往你身边。');await wait(1800);if(token!==run)return;scene('library portal standing');await wait(2000);scene('library portal standing touching');tone(880,0,2);await wait(2000);scene('library portal entering');await wait(1800);scene('library portal entering tunneling');chime();caption('把距离，变成一条星光隧道','带着一点想念，\n和好多好多爱，出发！');await wait(4800);if(token!==run)return;scene('home arriving');chime();await wait(3000);scene('home hugging');caption('但我其实也一直陪着你','但我其实也一直陪着你呀！','还有呢 ♡');step=3;break;case 3:caption('日常的小小幸福','缠着你给我买东西～ 🛍','还有还有 ♡');step=4;break;case 4:caption('最喜欢，和你说说话','无聊的时候就来骚扰你嘿嘿😝','今天有一点不同 ✧');step=5;break;case 5:scene('home');caption('一个小小的秘密','不过今天，\n我可是有备而来！');await wait(2400);scene('home gifting');chime();caption('一份会变魔术的生日礼物','送你一份小小的生日礼物！','点击打开礼物 ♡');step=6;break;case 6:scene('home gifting unwrapped');chime();caption('把平安与顺意，戴在手上','送你一份小小的祝福，\n愿妈妈平安顺遂，事事顺意。❤️');await wait(3500);if(token!==run)return;caption('还有一点点魔法','送你一份小小的祝福，\n愿妈妈平安顺遂，事事顺意。❤️','点击见证奇迹 ✨');step=7;break;case 7:next.hidden=true;app.classList.add('flash');chime();await wait(1200);if(token!==run)return;$('#magic').showModal();step=8;break}busy=false};
$('#gift').style.cursor='pointer';$('#gift').onclick=()=>{if(step===6&&!busy)next.click()};
$('#found').onclick=async()=>{if(busy||step!==8)return;busy=true;step=9;$('#magic').close();app.classList.add('flash');chime();await wait(1200);scene('home hugging final');$('#ending').hidden=false;$('#letter-text').replaceChildren();const paragraphs=['虽然今年不能实地陪你过生日，\n未来好几年可能都是，','但是其实除了不能抱抱，不能吃到你的生日蛋糕以外，\n其他也没有什么大改变，\n我们还是经常聊天，无话不谈。','所以呀，不要太想我，\n多运动，做美食，玩儿金臭臭，\n多跟我爸出去走走……','爱你😘'];paragraphs.forEach((text,i)=>{let p=document.createElement('p');p.textContent=text;p.style.whiteSpace='pre-line';p.style.animationDelay=`${i*3}s`;$('#letter-text').append(p)});$('#ending').scrollIntoView({behavior:'smooth',block:'nearest'});busy=false};
$('#magic').addEventListener('cancel',e=>e.preventDefault());
$('#replay').onclick=()=>{run++;step=0;busy=false;app.className='';app.dataset.scene='letter';$('#envelope').className='';$('#ending').hidden=true;$('#letter-text').replaceChildren();caption('来自远方的信','','点击打开信封 ♡');window.scrollTo({top:0,behavior:'smooth'})};
document.addEventListener('visibilitychange',()=>{if(audio){if(document.hidden)audio.suspend();else if(!muted)audio.resume()}});
</script></body></html>
